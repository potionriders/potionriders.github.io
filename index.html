<!DOCTYPE html>
<html>
<head>
  <!--
    base-href: viene sostituito dal valore di `--base-href` passato a
    `flutter build web`. NON hardcodarlo qui.
    - GitHub Pages in sottocartella:  --base-href /potion-riders/
    - dominio root:                   --base-href /
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- Fondamentale per il rendering su smartphone (i giocatori usano il telefono) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Potion Riders – gioco itinerante a sottobicchieri per GiocAosta">
  <meta name="theme-color" content="#4B2E83">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Potion Riders">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Potion Riders</title>
  <link rel="manifest" href="manifest.json">

  <!--
    jsQR: richiesto da `qrcode_reader_web` per la scansione QR su web.
    Il package NON inietta la libreria da solo (vedi README), quindi va
    caricata qui. Senza, la fotocamera si apre ma nessun QR viene rilevato.
  -->
  <script src="vendor/jsQR.min.js"></script>
</head>
<body>
  <!-- flutter_bootstrap.js registra da solo il service worker: niente script manuale. -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
